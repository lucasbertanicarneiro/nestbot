services:
  postgres:
    # imagem oficial do pgvector: Postgres 16 com a extensao ja compilada
    image: pgvector/pgvector:pg16
    container_name: nestbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nestbot}
      POSTGRES_USER: ${POSTGRES_USER:-nestbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # exposto para o Power BI conectar do host
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # scripts em initdb.d rodam UMA vez, na primeira criacao do volume
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./analytics/views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nestbot} -d ${POSTGRES_DB:-nestbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: nestbot-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nestbot}
      POSTGRES_USER: ${POSTGRES_USER:-nestbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY:?defina GROQ_API_KEY no .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?defina TELEGRAM_BOT_TOKEN no .env}
      GROQ_MODELO_GERACAO: ${GROQ_MODELO_GERACAO:-llama-3.3-70b-versatile}
      GROQ_MODELO_RAPIDO: ${GROQ_MODELO_RAPIDO:-llama-3.1-8b-instant}
      MODELO_EMBEDDING: ${MODELO_EMBEDDING:-intfloat/multilingual-e5-small}
      LIMIAR_SIMILARIDADE: ${LIMIAR_SIMILARIDADE:-0.62}
      AVALIAR_AUTOMATICAMENTE: ${AVALIAR_AUTOMATICAMENTE:-true}
      SAL_HASH: ${SAL_HASH:-nestbot-local}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      PORTA_WEBHOOK: ${PORTA_WEBHOOK:-8080}
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./data:/app/data:ro
      # cache do modelo de embedding: evita baixar 500MB a cada restart
      - hf_cache:/app/.cache/huggingface
    ports:
      - "${PORTA_WEBHOOK:-8080}:8080"

volumes:
  pgdata:
  hf_cache:
