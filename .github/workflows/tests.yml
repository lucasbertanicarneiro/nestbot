name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependencias
        run: |
          # Torch em versao CPU: mesmo padrao do Dockerfile, senao o pip
          # puxa a build CUDA por engano num runner sem GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Roda os testes
        run: python -m pytest -v
